#development version of configurations
server:
  port: 8083

# database connections
spring:
  ai:
    chat:
      client:
        enabled: false
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: codellama:latest
          temperature: 0.7
#    openai:
#      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          model: gpt-5.2
#          temperature: 0.2
#          max_tokens: 1000
  datasource:
#    url: jdbc:mysql://host.docker.internal:3306/auth_app
#    url: jdbc:mysql://localhost:3306/auth_app
#    username: root
#    password: password

    url: jdbc:h2:file:~/authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

#  hikari:
#    pool-name: HikariCP
#    maximum-pool-size: 5
#    connection-timeout: 10000
#    idle-timeout: 600000
#    max-lifetime: 1800000
#    validation-timeout: 1800000
#    leak-detection-threshold: 0
#    initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  security:
    # oauth configuration
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            #/login/oauth2/code/google
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID:test-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:test-client-secret}
            #/login/oauth2/code/github
            scope:
              - user:email
              - read:user

# jpa and hibernate configurations

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:saiofal;vkasfbehwqpofhjashofjaswfpojasfvbafop[hfifonfo[shjfwefjjfslajfsahfoshffasnbash[f}
    issuer: ${JWT_ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TOKEN:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}

app:
  cors:
#    front-end-url: ${FRONT_END_URL:http://localhost:5173}
    front-end-url: http://192.168.1.15:3000  # Your phone IP + React port
  auth:
    frontend:
      success-redirect: ${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
      failure-redirect: ${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true